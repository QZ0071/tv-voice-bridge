plugins { id 'com.android.application' }
android {
    namespace 'io.github.qz0071.tvvoicebridge'
    compileSdk 34
    defaultConfig {
        applicationId 'io.github.qz0071.tvvoicebridge'
        minSdk 26
        targetSdk 34
        versionCode 10000
        versionName '1.0.0'
    }
    buildTypes { release { signingConfig signingConfigs.debug; minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
